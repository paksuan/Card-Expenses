<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expenses">
<title>Expenses</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: rgba(255,255,255,0.08);
    --text: #f0ede8;
    --muted: #888;
    --accent: #c9f06e;
    --accent-dark: #8fb83d;
    --danger: #ff6b6b;
    --cats: #f7c948, #6ec9f0, #f06e9e, #6ef0b8, #f0906e, #a06ef0, #6e9ef0, #f0d46e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }

  /* Layout */
  #app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  #tab-bar { display: flex; background: var(--surface); border-top: 1px solid var(--border); padding: 8px 0 max(8px, env(safe-area-inset-bottom)); flex-shrink: 0; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; cursor: pointer; transition: opacity 0.2s; }
  .tab-icon { font-size: 20px; line-height: 1; }
  .tab-label { font-size: 10px; font-weight: 500; color: var(--muted); transition: color 0.2s; }
  .tab.active .tab-label { color: var(--accent); }
  .tab-icon svg { width: 22px; height: 22px; stroke: var(--muted); transition: stroke 0.2s; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab.active .tab-icon svg { stroke: var(--accent); }

  #content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  .view { display: none; padding: 24px 20px 20px; min-height: 100%; }
  .view.active { display: block; }

  /* Typography */
  .serif { font-family: 'DM Serif Display', serif; }
  .page-title { font-family: 'DM Serif Display', serif; font-size: 28px; color: var(--text); margin-bottom: 4px; }
  .page-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }

  /* Add Expense Form */
  .amount-display { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; text-align: center; cursor: text; position: relative; }
  .amount-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  .amount-value { font-family: 'DM Serif Display', serif; font-size: 48px; color: var(--text); line-height: 1; }
  .amount-value.placeholder { color: #333; }
  #amount-input { position: absolute; opacity: 0; width: 1px; height: 1px; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; padding-left: 4px; }
  .field input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; font-size: 16px; color: var(--text); font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s; -webkit-appearance: none; }
  .field input:focus { border-color: var(--accent); }
  .field input::placeholder { color: #444; }
  .field input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); }

  .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .cat-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 10px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; transition: all 0.15s; text-align: center; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; gap: 8px; }
  .cat-btn .cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .cat-btn.selected { border-color: var(--accent); color: var(--text); background: rgba(201,240,110,0.08); }
  .cat-btn.add-cat { border-style: dashed; justify-content: center; color: #555; }

  .submit-btn { width: 100%; background: var(--accent); color: #0f0f0f; border: none; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; margin-top: 20px; transition: transform 0.1s, background 0.2s; }
  .submit-btn:active { transform: scale(0.98); background: var(--accent-dark); }

  /* Toast */
  #toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 10px 20px; font-size: 13px; color: var(--text); opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 100; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Dashboard */
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .month-nav-btn { width: 36px; height: 36px; background: var(--surface); border: 1px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; color: var(--text); }
  .month-title { font-family: 'DM Serif Display', serif; font-size: 20px; }

  .total-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
  .total-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .total-amount { font-family: 'DM Serif Display', serif; font-size: 36px; color: var(--accent); }
  .total-count { font-size: 12px; color: var(--muted); }

  .section-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }

  .cat-bar-item { margin-bottom: 14px; }
  .cat-bar-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .cat-bar-name { font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 6px; }
  .cat-bar-amount { font-size: 13px; font-weight: 500; color: var(--text); }
  .cat-bar-track { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .cat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s cubic-bezier(0.16,1,0.3,1); }

  .tx-list { margin-top: 20px; }
  .tx-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .tx-item:last-child { border-bottom: none; }
  .tx-left { display: flex; align-items: center; gap: 10px; }
  .tx-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .tx-name { font-size: 14px; color: var(--text); }
  .tx-meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .tx-amount { font-size: 15px; font-weight: 500; color: var(--text); }
  .tx-delete { font-size: 11px; color: var(--danger); margin-left: 10px; cursor: pointer; padding: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; }

  /* Modal for add category */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .modal-bg.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border-radius: 20px 20px 0 0; padding: 20px 20px max(20px, env(safe-area-inset-bottom)); width: 100%; }
  .modal-title { font-family: 'DM Serif Display', serif; font-size: 20px; margin-bottom: 16px; }
  .modal input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; font-size: 16px; color: var(--text); font-family: 'DM Sans', sans-serif; outline: none; margin-bottom: 12px; -webkit-appearance: none; }
  .modal input:focus { border-color: var(--accent); }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btn { flex: 1; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; border: none; }
  .modal-btn.cancel { background: var(--surface2); color: var(--muted); }
  .modal-btn.confirm { background: var(--accent); color: #0f0f0f; }
</style>
</head>
<body>
<div id="app">
  <div id="content">

    <!-- ADD VIEW -->
    <div class="view active" id="view-add">
      <p class="page-title">Add expense</p>
      <p class="page-sub">Log a new credit card transaction</p>

      <div class="amount-display" onclick="document.getElementById('amount-input').focus()">
        <div class="amount-label">Amount (SGD)</div>
        <div class="amount-value placeholder" id="amount-display">$0.00</div>
        <input type="number" id="amount-input" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
      </div>

      <div class="field">
        <label>Merchant</label>
        <input type="text" id="merchant" placeholder="e.g. Starbucks">
      </div>

      <div class="field">
        <label>Date</label>
        <input type="date" id="date">
      </div>

      <div class="field">
        <label>Category</label>
        <div class="cat-grid" id="cat-grid"></div>
      </div>

      <button class="submit-btn" onclick="saveExpense()">Save Expense</button>
    </div>

    <!-- DASHBOARD VIEW -->
    <div class="view" id="view-dash">
      <div class="month-nav">
        <div class="month-nav-btn" onclick="changeMonth(-1)">‹</div>
        <div class="month-title" id="month-label">May 2026</div>
        <div class="month-nav-btn" onclick="changeMonth(1)">›</div>
      </div>

      <div id="dash-content"></div>
    </div>

  </div>

  <div id="tab-bar">
    <div class="tab active" onclick="switchTab('add')" id="tab-add">
      <div class="tab-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      </div>
      <span class="tab-label">Add</span>
    </div>
    <div class="tab" onclick="switchTab('dash')" id="tab-dash">
      <div class="tab-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </div>
      <span class="tab-label">Dashboard</span>
    </div>
  </div>
</div>

<div id="toast"></div>

<div class="modal-bg" id="cat-modal">
  <div class="modal">
    <div class="modal-title">New category</div>
    <input type="text" id="new-cat-input" placeholder="e.g. Healthcare" maxlength="20">
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeCatModal()">Cancel</button>
      <button class="modal-btn confirm" onclick="confirmNewCat()">Add</button>
    </div>
  </div>
</div>

<script>
const CAT_COLORS = ['#f7c948','#6ec9f0','#f06e9e','#6ef0b8','#f0906e','#a06ef0','#6e9ef0','#f0d46e','#e06ef0','#6ef0d4'];
const DEFAULT_CATS = ['Dining','Shopping','Transport','Groceries','Entertainment','Travel','Utilities','Healthcare'];

function getData() {
  try { return JSON.parse(localStorage.getItem('exp_data') || '{"expenses":[],"cats":[]}'); }
  catch(e) { return {expenses:[], cats:[]}; }
}
function saveData(d) { localStorage.setItem('exp_data', JSON.stringify(d)); }

function getCats() {
  const d = getData();
  if (!d.cats || d.cats.length === 0) {
    d.cats = DEFAULT_CATS;
    saveData(d);
  }
  return d.cats;
}

let selectedCat = null;
let dashMonth = new Date();
dashMonth = new Date(dashMonth.getFullYear(), dashMonth.getMonth(), 1);

function renderCatGrid() {
  const grid = document.getElementById('cat-grid');
  const cats = getCats();
  grid.innerHTML = '';
  cats.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (selectedCat === c ? ' selected' : '');
    btn.innerHTML = `<span class="cat-dot" style="background:${CAT_COLORS[i % CAT_COLORS.length]}"></span>${c}`;
    btn.onclick = () => { selectedCat = c; renderCatGrid(); };
    grid.appendChild(btn);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'cat-btn add-cat';
  addBtn.textContent = '+ Add category';
  addBtn.onclick = openCatModal;
  grid.appendChild(addBtn);
}

function openCatModal() {
  document.getElementById('cat-modal').classList.add('open');
  setTimeout(() => document.getElementById('new-cat-input').focus(), 300);
}
function closeCatModal() {
  document.getElementById('cat-modal').classList.remove('open');
  document.getElementById('new-cat-input').value = '';
}
function confirmNewCat() {
  const val = document.getElementById('new-cat-input').value.trim();
  if (!val) return;
  const d = getData();
  if (!d.cats.includes(val)) { d.cats.push(val); saveData(d); }
  selectedCat = val;
  closeCatModal();
  renderCatGrid();
}

// Amount input
const amountInput = document.getElementById('amount-input');
const amountDisplay = document.getElementById('amount-display');
amountInput.addEventListener('input', () => {
  const v = parseFloat(amountInput.value);
  if (isNaN(v) || amountInput.value === '') {
    amountDisplay.textContent = '$0.00';
    amountDisplay.classList.add('placeholder');
  } else {
    amountDisplay.textContent = '$' + v.toFixed(2);
    amountDisplay.classList.remove('placeholder');
  }
});

// Set today's date
function setToday() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  document.getElementById('date').value = `${y}-${m}-${day}`;
}

function saveExpense() {
  const amount = parseFloat(amountInput.value);
  const merchant = document.getElementById('merchant').value.trim();
  const date = document.getElementById('date').value;
  const cat = selectedCat;
  if (!amount || amount <= 0) { showToast('Please enter an amount'); return; }
  if (!merchant) { showToast('Please enter a merchant'); return; }
  if (!date) { showToast('Please select a date'); return; }
  if (!cat) { showToast('Please select a category'); return; }
  const d = getData();
  d.expenses.push({ id: Date.now(), amount, merchant, date, cat });
  saveData(d);
  amountInput.value = '';
  amountDisplay.textContent = '$0.00';
  amountDisplay.classList.add('placeholder');
  document.getElementById('merchant').value = '';
  setToday();
  selectedCat = null;
  renderCatGrid();
  showToast('Expense saved!');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function switchTab(tab) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'dash') renderDash();
}

function changeMonth(dir) {
  dashMonth = new Date(dashMonth.getFullYear(), dashMonth.getMonth() + dir, 1);
  renderDash();
}

function renderDash() {
  const y = dashMonth.getFullYear();
  const m = dashMonth.getMonth();
  const label = dashMonth.toLocaleDateString('en-SG', { month: 'long', year: 'numeric' });
  document.getElementById('month-label').textContent = label;

  const d = getData();
  const cats = getCats();
  const exps = d.expenses.filter(e => {
    const ed = new Date(e.date);
    return ed.getFullYear() === y && ed.getMonth() === m;
  });

  const container = document.getElementById('dash-content');
  if (exps.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">No expenses for this month</div></div>`;
    return;
  }

  const total = exps.reduce((s, e) => s + e.amount, 0);
  const byCat = {};
  exps.forEach(e => { byCat[e.cat] = (byCat[e.cat] || 0) + e.amount; });
  const maxCat = Math.max(...Object.values(byCat));
  const sortedCats = Object.entries(byCat).sort((a,b) => b[1]-a[1]);

  let html = `<div class="total-card">
    <div>
      <div class="total-label">Total spent</div>
      <div class="total-amount">$${total.toFixed(2)}</div>
    </div>
    <div class="total-count" style="text-align:right;">${exps.length}<br><span style="font-size:11px;">transactions</span></div>
  </div>`;

  html += `<div class="section-title">By category</div>`;
  sortedCats.forEach(([cat, amt]) => {
    const idx = cats.indexOf(cat);
    const color = CAT_COLORS[idx >= 0 ? idx % CAT_COLORS.length : 0];
    const pct = Math.round((amt / maxCat) * 100);
    const sharePct = Math.round((amt / total) * 100);
    html += `<div class="cat-bar-item">
      <div class="cat-bar-top">
        <div class="cat-bar-name"><span style="width:8px;height:8px;border-radius:50%;background:${color};display:inline-block;"></span>${cat}</div>
        <div class="cat-bar-amount">$${amt.toFixed(2)} <span style="font-size:11px;color:var(--muted);">${sharePct}%</span></div>
      </div>
      <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%;background:${color};"></div></div>
    </div>`;
  });

  html += `<div class="section-title" style="margin-top:24px;">Transactions</div><div class="tx-list">`;
  const sorted = [...exps].sort((a,b) => new Date(b.date)-new Date(a.date));
  sorted.forEach(e => {
    const idx = cats.indexOf(e.cat);
    const color = CAT_COLORS[idx >= 0 ? idx % CAT_COLORS.length : 0];
    const dateStr = new Date(e.date).toLocaleDateString('en-SG', {day:'numeric', month:'short'});
    html += `<div class="tx-item">
      <div class="tx-left">
        <div class="tx-dot" style="background:${color}"></div>
        <div>
          <div class="tx-name">${e.merchant}</div>
          <div class="tx-meta">${dateStr} · ${e.cat}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;">
        <div class="tx-amount">$${e.amount.toFixed(2)}</div>
        <div class="tx-delete" onclick="deleteExpense(${e.id})">✕</div>
      </div>
    </div>`;
  });
  html += `</div>`;
  container.innerHTML = html;
}

function deleteExpense(id) {
  const d = getData();
  d.expenses = d.expenses.filter(e => e.id !== id);
  saveData(d);
  renderDash();
}

// Init
setToday();
renderCatGrid();
</script>
</body>
</html>
